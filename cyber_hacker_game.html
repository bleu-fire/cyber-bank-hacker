<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER BANK INFILTRATION - Custom 3D Models</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050814;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      height: 100vh;
    }
    #game-canvas { width: 100%; height: 100%; display: block; }
    
    /* HUD UI */
    .hud {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      right: 1.5rem;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }
    .hud-box {
      background: rgba(5, 8, 20, 0.85);
      border: 1px solid #00ff66;
      padding: 0.75rem 1.25rem;
      border-radius: 0.5rem;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
    }
    .hud-title { font-size: 0.7rem; color: #38bdf8; text-transform: uppercase; font-weight: bold; }
    .hud-val { font-size: 1.25rem; font-weight: bold; }
    
    /* Terminal Prompt Modal */
    .terminal-modal {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 550px;
      background: rgba(2, 6, 23, 0.95);
      border: 2px solid #00ff66;
      border-radius: 0.75rem;
      padding: 1.5rem;
      box-shadow: 0 0 35px rgba(0, 255, 102, 0.5);
      z-index: 30;
    }
    .terminal-header {
      font-size: 1.1rem;
      font-weight: bold;
      color: #38bdf8;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
    }
    .terminal-log {
      height: 160px;
      overflow-y: auto;
      font-size: 0.9rem;
      line-height: 1.4;
      margin-bottom: 1rem;
      color: #00ff66;
    }
    .terminal-input-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .terminal-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #00ff66;
      color: #00ff66;
      padding: 0.6rem 0.8rem;
      font-family: inherit;
      font-size: 1rem;
      border-radius: 0.4rem;
      outline: none;
    }
    
    .hidden { display: none !important; }
    .interact-prompt {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 255, 102, 0.2);
      border: 1px solid #00ff66;
      color: #ffffff;
      padding: 0.6rem 1.5rem;
      border-radius: 9999px;
      font-weight: bold;
      font-size: 1rem;
      z-index: 10;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div class="hud">
    <div class="hud-box">
      <div class="hud-title">Objective</div>
      <div class="hud-val" id="obj-text">Sneak Character to PSX Retro Terminal & Press [E]</div>
    </div>
    <div class="hud-box">
      <div class="hud-title">3D Models</div>
      <div class="hud-val" style="color: #00ff66;" id="model-status">Custom 3D Models Loaded</div>
    </div>
  </div>

  <div class="interact-prompt hidden" id="interact-prompt">Press [E] to Hack Terminal</div>

  <!-- Hacker Terminal Screen -->
  <div class="terminal-modal hidden" id="terminal-modal">
    <div class="terminal-header">=== RETRO PSX FIREWALL BREACH ===</div>
    <div class="terminal-log" id="terminal-log">
      [CONNECTED TO PSX_TERMINAL_NODE]<br>
      FIREWALL: ACTIVE (AES-256)<br>
      HINT: Passcode anagram is 'RBCYEEISHT'<br><br>
      Type passcode to breach vault doors:
    </div>
    <div class="terminal-input-row">
      <span>&gt;</span>
      <input type="text" class="terminal-input" id="terminal-input" placeholder="Type password here..." autofocus onkeydown="handleInput(event)">
    </div>
  </div>

  <div id="game-canvas"></div>

  <script>
    let scene, camera, renderer, playerGroup, terminalGroup, vaultDoor, cameraSpotlight;
    let keys = {};
    let isNearTerminal = false;
    let isTerminalOpen = false;
    let isVaultUnlocked = false;

    function init() {
      const container = document.getElementById('game-canvas');

      // Scene
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x050814, 0.03);

      // Camera setup
      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 4, 8);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 2.5);
      scene.add(ambientLight);

      const mainLight = new THREE.DirectionalLight(0x38bdf8, 2);
      mainLight.position.set(5, 10, 5);
      scene.add(mainLight);

      const cyanPoint = new THREE.PointLight(0x00f0ff, 5, 15);
      cyanPoint.position.set(-6, 3, -6);
      scene.add(cyanPoint);

      // Red Security Camera Spotlight
      cameraSpotlight = new THREE.SpotLight(0xef4444, 5, 25, Math.PI / 5, 0.5);
      cameraSpotlight.position.set(0, 8, 0);
      cameraSpotlight.target.position.set(0, 0, 0);
      scene.add(cameraSpotlight);
      scene.add(cameraSpotlight.target);

      // Build 3D Room & Load Custom GLB Models
      buildRoom();
      loadCustomGLBCharacter();
      loadRetroMonitorGLB();

      // Keyboard Controls
      window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
      window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
      window.addEventListener('keydown', handleGlobalKeys);
      window.addEventListener('resize', onWindowResize);

      animate();
    }

    function loadCustomGLBCharacter() {
      playerGroup = new THREE.Group();
      scene.add(playerGroup);

      const loader = new THREE.GLTFLoader();
      loader.load('Assets/Models/low_poly_character.glb', function (gltf) {
        const model = gltf.scene;

        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        model.position.x = -center.x;
        model.position.y = -box.min.y;
        model.position.z = -center.z;

        const maxDim = Math.max(size.x, size.y, size.z);
        if (maxDim > 0) {
          const targetScale = 2.0 / maxDim;
          model.scale.set(targetScale, targetScale, targetScale);
        }

        playerGroup.add(model);
      }, undefined, function (error) {
        console.error('Error loading custom character model:', error);
      });

      playerGroup.position.set(0, 0, 4);
    }

    function loadRetroMonitorGLB() {
      terminalGroup = new THREE.Group();
      scene.add(terminalGroup);

      const loader = new THREE.GLTFLoader();
      loader.load('Assets/Models/retro_monitor_pc_tower.glb', function (gltf) {
        const model = gltf.scene;

        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        model.position.x = -center.x;
        model.position.y = -box.min.y;
        model.position.z = -center.z;

        const maxDim = Math.max(size.x, size.y, size.z);
        if (maxDim > 0) {
          const targetScale = 2.2 / maxDim;
          model.scale.set(targetScale, targetScale, targetScale);
        }

        terminalGroup.add(model);
        console.log('Retro PSX Monitor PC Tower loaded successfully!');
      }, undefined, function (error) {
        console.error('Error loading retro monitor model:', error);
      });

      terminalGroup.position.set(-6, 0, -6);
      terminalGroup.rotation.y = Math.PI / 4;
    }

    function buildRoom() {
      // Floor
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8 });
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(24, 24), floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // Back Wall
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x090d16 });
      const backWall = new THREE.Mesh(new THREE.BoxGeometry(24, 10, 0.5), wallMat);
      backWall.position.set(0, 5, -12);
      scene.add(backWall);

      // Vault Door
      const vaultMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.9, roughness: 0.2 });
      vaultDoor = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.5, 0.4, 24), vaultMat);
      vaultDoor.rotation.x = Math.PI / 2;
      vaultDoor.position.set(0, 3, -11.7);
      scene.add(vaultDoor);
    }

    function handleGlobalKeys(e) {
      if (e.key.toLowerCase() === 'e' && isNearTerminal && !isTerminalOpen) {
        openTerminal();
      }
      if (e.key === 'Escape' && isTerminalOpen) {
        closeTerminal();
      }
    }

    function openTerminal() {
      isTerminalOpen = true;
      document.getElementById('terminal-modal').classList.remove('hidden');
      document.getElementById('terminal-input').focus();
    }

    function closeTerminal() {
      isTerminalOpen = false;
      document.getElementById('terminal-modal').classList.add('hidden');
    }

    function handleInput(e) {
      if (e.key === 'Enter') {
        const input = document.getElementById('terminal-input').value.trim().toUpperCase();
        const log = document.getElementById('terminal-log');

        if (input === 'CYBERHEIST' || input === 'CYBER') {
          log.innerHTML += `<br><span style="color:#00ff66">&gt; ${input}</span><br><span style="color:#00ff66">&gt;&gt;&gt; ACCESS GRANTED! VAULT UNLOCKED! &lt;&lt;&lt;</span>`;
          unlockVault();
        } else {
          log.innerHTML += `<br><span style="color:#ef4444">&gt; ${input}</span><br><span style="color:#ef4444">[ACCESS DENIED] Incorrect passcode!</span>`;
        }

        document.getElementById('terminal-input').value = '';
        log.scrollTop = log.scrollHeight;
      }
    }

    function unlockVault() {
      isVaultUnlocked = true;
      document.getElementById('obj-text').innerText = 'Vault Breached! Claim Bank Treasure!';
      document.getElementById('obj-text').style.color = '#00ff66';
      setTimeout(closeTerminal, 1500);
    }

    function animate() {
      requestAnimationFrame(animate);

      // Player Movement
      if (!isTerminalOpen && playerGroup) {
        const speed = keys['c'] ? 0.05 : 0.12;
        let moving = false;
        let moveVec = new THREE.Vector3();

        if (keys['w'] || keys['arrowup']) { moveVec.z -= speed; moving = true; }
        if (keys['s'] || keys['arrowdown']) { moveVec.z += speed; moving = true; }
        if (keys['a'] || keys['arrowleft']) { moveVec.x -= speed; moving = true; }
        if (keys['d'] || keys['arrowright']) { moveVec.x += speed; moving = true; }

        if (moving) {
          playerGroup.position.add(moveVec);
          const angle = Math.atan2(moveVec.x, moveVec.z);
          playerGroup.rotation.y = THREE.MathUtils.lerp(playerGroup.rotation.y, angle, 0.15);
        }

        // Crouch scaling
        if (keys['c']) {
          playerGroup.scale.y = THREE.MathUtils.lerp(playerGroup.scale.y, 0.6, 0.2);
        } else {
          playerGroup.scale.y = THREE.MathUtils.lerp(playerGroup.scale.y, 1.0, 0.2);
        }

        // Player bounds
        playerGroup.position.x = Math.max(-10, Math.min(10, playerGroup.position.x));
        playerGroup.position.z = Math.max(-10, Math.min(10, playerGroup.position.z));
      }

      // Security Camera Sweep
      const sweepAngle = Math.sin(Date.now() * 0.002) * 6;
      cameraSpotlight.target.position.x = sweepAngle;

      // Check distance to PSX Retro Terminal (-6, 0, -6)
      if (playerGroup) {
        const distToTerminal = playerGroup.position.distanceTo(new THREE.Vector3(-6, 0, -6));
        isNearTerminal = distToTerminal < 3.0;

        const promptEl = document.getElementById('interact-prompt');
        if (isNearTerminal && !isTerminalOpen && !isVaultUnlocked) {
          promptEl.classList.remove('hidden');
        } else {
          promptEl.classList.add('hidden');
        }

        // Camera Follow Smooth
        camera.position.x += (playerGroup.position.x - camera.position.x) * 0.08;
        camera.position.z += (playerGroup.position.z + 6 - camera.position.z) * 0.08;
        camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.0, playerGroup.position.z);
      }

      // Smooth Vault Door Open
      if (isVaultUnlocked && vaultDoor.position.y < 7) {
        vaultDoor.position.y += 0.05;
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.onload = init;
  </script>
</body>
</html>
